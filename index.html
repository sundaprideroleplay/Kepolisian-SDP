<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEPOLISIAN SUNDAPRIDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --panel-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-gold: #e2b857;
            --accent-blue: #3b82f6;
            --text-silver: #94a3b8;
            --white: #ffffff;
            --success: #10b981;
            --danger: #f43f5e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-deep); color: var(--white); min-height: 100vh; overflow-x: hidden; background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, #020617 80%); }

        .sidebar { width: 260px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); position: fixed; height: calc(100vh - 40px); margin: 20px; border-radius: 24px; padding: 40px 20px; z-index: 100; border: 1px solid var(--border-glass); display: flex; flex-direction: column; }
        .main-content { margin-left: 300px; padding: 40px 40px 40px 20px; width: calc(100% - 300px); }

        .card { background: var(--panel-glass); backdrop-filter: blur(10px); padding: 25px; border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--border-glass); transition: 0.3s; }
        .nav-item { padding: 14px 18px; cursor: pointer; border-radius: 12px; margin-bottom: 5px; transition: 0.2s ease; display: flex; align-items: center; gap: 12px; color: var(--text-silver); font-size: 0.9rem; font-weight: 500; }
        .nav-item.active { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); border-right: 3px solid var(--accent-blue); border-radius: 12px 4px 4px 12px; }

        input, select, textarea { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.2); color: white; margin-bottom: 15px; outline: none; }
        .btn { padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; border: none; transition: 0.3s; font-size: 0.85rem; }
        .btn-blue { background: var(--accent-blue); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: var(--text-silver); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 15px; border-bottom: 1px solid var(--border-glass); font-size: 0.85rem; }
    </style>
</head>
<body>

    <section id="login-section" style="height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;">
        <div style="width: 100%; max-width: 400px; text-align: center;">
            <img src="logopolissdp2.png" style="width: 100px; margin-bottom: 20px;">
            <h2 style="letter-spacing: 2px; margin-bottom: 30px; font-weight: 800;">KEPOLISIAN SUNDAPRIDE</h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="NIP" required>
                <input type="password" id="password" placeholder="NAMA" required>
                <button type="submit" class="btn btn-blue" style="width: 100%; height: 55px;">AUTHENTICATION</button>
            </form>
        </div>
    </section>

    <section id="dashboard-section" style="display: none;">
        <aside class="sidebar">
            <div style="text-align: center; margin-bottom: 40px;">
                <img src="logopolissdp2.png" style="width: 80px; margin-bottom: 10px;">
                <h4 id="user-name-sidebar">Nama</h4>
                <p id="user-rank-sidebar" style="color: var(--accent-gold); font-size: 0.6rem; font-weight: 800;"></p>
            </div>
            <nav style="flex:1">
                <div id="nav-home" onclick="showPage('home')" class="nav-item active">● Dashboard</div>
                <div id="admin-tools" style="display:none;">
                    <div id="nav-config" onclick="showPage('config')" class="nav-item">● Tarif Gaji</div>
                    <div id="nav-finance" onclick="showPage('finance')" class="nav-item">● Laporan Gaji</div>
                    <div id="nav-admin" onclick="showPage('admin')" class="nav-item">● Database</div>
                </div>
            </nav>
            <div onclick="location.reload()" class="nav-item" style="color: var(--danger); margin-top: auto;">○ Keluar</div>
        </aside>

        <main class="main-content">
            <div id="page-home" class="page-section">
                <div id="user-duty-card" class="card" style="display: none; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent-blue);">
                    <div><h2 id="welcome-user" style="font-weight: 300;">Halo!</h2><div id="status-desc"></div></div>
                    <button id="btn-duty-toggle" class="btn btn-blue" style="min-width: 180px;">MULAI TUGAS</button>
                </div>

                <div id="admin-leaderboard" class="card" style="display: none; background: linear-gradient(135deg, rgba(226, 184, 87, 0.05) 0%, transparent 100%); border-left: 4px solid var(--accent-gold);">
                    <h3 style="margin-bottom: 15px; font-size: 1rem;">🏆 STAFF TERBAIK</h3>
                    <div id="leaderboard-list" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;"></div>
                </div>

                <div class="card">
                    <h4 style="margin-bottom: 20px; font-size: 0.75rem; color: var(--text-silver);">PERSONEL AKTIF</h4>
                    <div id="active-duty-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px;"></div>
                </div>
            </div>

            <div id="page-config" class="page-section" style="display:none;">
                <div class="card"><h3>Tarif Gaji Per Pangkat</h3><div id="salary-config-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top:20px;"></div></div>
            </div>

            <div id="page-finance" class="page-section" style="display:none;">
                <div class="card">
                    <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
                        <h3>Laporan Penggajian</h3>
                        <div style="display:flex; gap:10px;"><button id="reset-fin-btn" class="btn btn-danger">Reset Menit</button><button onclick="exportDataGaji()" class="btn btn-success">Export Word</button></div>
                    </div>
                    <table><thead><tr><th>Nama</th><th>Pangkat</th><th>Menit</th><th style="text-align:right;">Total</th></tr></thead><tbody id="fin-list"></tbody></table>
                </div>
            </div>

            <div id="page-admin" class="page-section" style="display:none;">
                <div class="card">
                    <h3 id="form-title">Kelola Anggota</h3>
                    <input type="hidden" id="edit-key">
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top:15px;">
                        <input type="text" id="reg-nip" placeholder="NIP"><input type="text" id="reg-name" placeholder="Nama"><select id="reg-rank-select"></select>
                    </div>
                    <button id="reg-btn" class="btn btn-blue">Simpan Data</button><button id="cancel-edit-btn" class="btn" style="display:none; background:#334155; margin-left:10px;">Batal</button>
                </div>
                <div class="card"><table><thead><tr><th>NIP</th><th>Nama</th><th>Jabatan</th><th style="text-align:right;">Aksi</th></tr></thead><tbody id="emp-list"></tbody></table></div>
            </div>
        </main>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYGY_o_slwFAvUBgL9YHl0heVI2CuN3wc",
            authDomain: "kepolisian-sdp.firebaseapp.com",
            projectId: "kepolisian-sdp",
            storageBucket: "kepolisian-sdp.firebasestorage.app",
            messagingSenderId: "500563443117",
            appId: "1:500563443117:web:e1702bd08ee47eaa42f524",
            databaseURL: "https://kepolisian-sdp-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const rootPath = 'sipol_sdp_final';
        const defaultRanks = ["Jenderal", "KOMJENPOL", "IRJENPOL", "BRIGJENPOL", "KOMBESPOL", "AKBP", "KOMPOL", "AKP", "IPTU", "IPDA", "AIPTU", "AIPDA", "BRIPKA", "BRIGPOL", "BRIPTU", "BRIPDA", "Tamtama"];

        let sessionUser = null;
        let globalData = { members: {}, ranks: {} };

        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            const nip = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            if(nip.toLowerCase()==='admin' && pass==='321'){ 
                sessionUser={name:'PIMPINAN', role:'admin', nip:'ADMIN', rank:'KEPOLISIAN SDP'}; initDashboard(); 
            } else {
                const member = Object.values(globalData.members).find(m => m.nip === nip);
                if(member){ sessionUser={...member, role:'user'}; initDashboard(); }
                else alert("NIP Tidak Terdaftar!");
            }
        };

        function initDashboard() {
            document.getElementById('login-section').style.display='none';
            document.getElementById('dashboard-section').style.display='block';
            document.getElementById('user-name-sidebar').innerText = sessionUser.name;
            document.getElementById('user-rank-sidebar').innerText = sessionUser.rank;
            document.getElementById('admin-tools').style.display = sessionUser.role==='admin'?'block':'none';
            document.getElementById('user-duty-card').style.display = sessionUser.role==='admin'?'none':'flex';
            document.getElementById('admin-leaderboard').style.display = sessionUser.role==='admin'?'block':'none';
            showPage('home');
        }

        window.showPage = (id) => {
            document.querySelectorAll('.page-section').forEach(p=>p.style.display='none');
            document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
            document.getElementById('page-'+id).style.display='block';
            document.getElementById('nav-'+id).classList.add('active');
            render();
        };

        onValue(ref(database, rootPath), (snap) => {
            const data = snap.val(); 
            if(data){ 
                globalData.members=data.members||{}; globalData.ranks=data.ranks || {};
                if(Object.keys(globalData.ranks).length === 0) defaultRanks.forEach(r => globalData.ranks[r] = 2000);
                render(); 
            }
        });

        function render() {
            if(!sessionUser) return;
            const members = Object.values(globalData.members);
            
            // Render Leaderboard (Sort by totalDuty)
            if(sessionUser.role==='admin'){
                const top5 = [...members].sort((a,b) => (b.totalDuty||0) - (a.totalDuty||0)).slice(0,5);
                document.getElementById('leaderboard-list').innerHTML = top5.map((u, i) => `
                    <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; min-width: 160px; border: 1px solid var(--border-glass);">
                        <div style="font-size: 0.6rem; color: var(--accent-gold); font-weight: 800;">TOP ${i+1}</div>
                        <div style="font-size: 0.85rem; font-weight: 600; margin-top: 5px;">${u.name}</div>
                        <div style="font-size: 0.7rem; color: var(--success); font-weight: 700;">${u.totalDuty || 0} Menit</div>
                    </div>`).join('');
            }

            document.getElementById('reg-rank-select').innerHTML = defaultRanks.map(r => `<option value="${r}">${r}</option>`).join('');
            document.getElementById('active-duty-list').innerHTML = members.filter(m => m.isDuty).map(u => `<div style="background: rgba(16, 185, 129, 0.05); padding: 12px; border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.2);"><span style="font-weight:600; font-size:0.8rem;">${u.name}</span><div style="font-size:0.6rem; color:var(--accent-gold); font-weight:800;">${u.rank}</div></div>`).join('');

            if(sessionUser.role==='admin') {
                document.getElementById('fin-list').innerHTML = members.map(m => `<tr><td><b>${m.name}</b></td><td>${m.rank}</td><td>${m.totalDuty || 0}m</td><td style="text-align:right; font-weight:800; color:var(--success);">Rp ${((m.totalDuty || 0) * (globalData.ranks[m.rank]||0)).toLocaleString()}</td></tr>`).join('');
                document.getElementById('emp-list').innerHTML = Object.entries(globalData.members).map(([k,m])=>`<tr><td>${m.nip}</td><td><b>${m.name}</b></td><td>${m.rank}</td><td style="text-align:right;"><button onclick="window.editMem('${k}')" style="background:none; border:none; color:var(--accent-blue); cursor:pointer; font-weight:700;">Edit</button><button onclick="window.delMem('${k}')" style="color:var(--danger); border:none; background:none; cursor:pointer; margin-left:10px;">✕</button></td></tr>`).join('');
                document.getElementById('salary-config-list').innerHTML = defaultRanks.map(name => `<div class="card" style="margin:0; display:flex; justify-content:space-between; align-items:center; padding:15px;"><span style="font-size:0.8rem;">${name}</span><input type="number" value="${globalData.ranks[name] || 2000}" onchange="window.updateRankSalary('${name}', this.value)" style="width:90px; margin:0; padding:8px; font-size:0.8rem;"></div>`).join('');
            } else {
                const me = members.find(m => m.nip === sessionUser.nip);
                if(me) {
                    document.getElementById('welcome-user').innerText = `Halo, ${me.name}!`;
                    document.getElementById('status-desc').innerHTML = me.isDuty ? `<span style="font-size:0.7rem; color:var(--success); font-weight:800;">SYSTEM ONLINE - DUTY</span>` : `<span style="font-size:0.7rem; color:var(--text-silver);">STANDBY</span>`;
                    document.getElementById('btn-duty-toggle').innerText = me.isDuty ? "OFF DUTY" : "MULAI TUGAS";
                    document.getElementById('btn-duty-toggle').onclick = () => {
                        const k = Object.keys(globalData.members).find(key => globalData.members[key].nip === me.nip);
                        if(!me.isDuty) update(ref(database, `${rootPath}/members/${k}`), { isDuty:true, lastIn: Date.now() });
                        else {
                            const diff = Math.floor((Date.now()-me.lastIn)/60000);
                            let nt = (me.totalDuty||0)+(diff>0?diff:1);
                            if(nt > 840) nt = 840;
                            update(ref(database, `${rootPath}/members/${k}`), { isDuty:false, totalDuty: nt });
                        }
                    };
                }
            }
        }

        window.updateRankSalary = (n,v) => update(ref(database, `${rootPath}/ranks`), {[n]:parseInt(v)});
        window.delMem = (k) => confirm("Hapus anggota?") && remove(ref(database, `${rootPath}/members/${k}`));
        window.editMem = (k) => {
            const m = globalData.members[k];
            document.getElementById('edit-key').value = k;
            document.getElementById('reg-nip').value = m.nip;
            document.getElementById('reg-name').value = m.name;
            document.getElementById('reg-rank-select').value = m.rank;
            document.getElementById('cancel-edit-btn').style.display = "inline-block";
        };

        document.getElementById('reg-btn').onclick = () => {
            const k = document.getElementById('edit-key').value;
            const p = { nip: document.getElementById('reg-nip').value, name: document.getElementById('reg-name').value, rank: document.getElementById('reg-rank-select').value };
            if(k) update(ref(database, `${rootPath}/members/${k}`), p);
            else push(ref(database, `${rootPath}/members`), {...p, totalDuty:0, isDuty:false});
            document.getElementById('cancel-edit-btn').click();
        };

        document.getElementById('cancel-edit-btn').onclick = () => {
            document.getElementById('edit-key').value = ""; document.getElementById('reg-nip').value = ""; document.getElementById('reg-name').value = ""; document.getElementById('cancel-edit-btn').style.display = "none";
        };

        document.getElementById('reset-fin-btn').onclick = () => {
            if(confirm("Reset seluruh data menit?")) Object.keys(globalData.members).forEach(k => update(ref(database, `${rootPath}/members/${k}`), {totalDuty:0}));
        };

        window.exportDataGaji = () => {
            let totalAll = 0;
            let rows = Object.values(globalData.members).map(u => {
                const sal = (u.totalDuty || 0) * (globalData.ranks[u.rank] || 0); totalAll += sal;
                return `<tr><td style="border:1pt solid black; padding:5pt;">${u.name}</td><td style="border:1pt solid black; padding:5pt;">${u.rank}</td><td style="border:1pt solid black; padding:5pt; text-align:center;">${u.totalDuty || 0}m</td><td style="border:1pt solid black; padding:5pt; text-align:right;">Rp ${sal.toLocaleString('id-ID')}</td></tr>`;
            }).join('');
            const html = `<html><body><h2 style="text-align:center;">LAPORAN GAJI PERSONEL</h2><table style="width:100%; border-collapse:collapse;"><thead><tr style="background:#f2f2f2;"><th>NAMA</th><th>PANGKAT</th><th>MENIT</th><th>TOTAL</th></tr></thead><tbody>${rows}</tbody><tfoot><tr style="background:#eee; font-weight:bold;"><td colspan="3" style="border:1pt solid black; padding:8pt; text-align:right;">GRAND TOTAL:</td><td style="border:1pt solid black; padding:8pt; text-align:right;">Rp ${totalAll.toLocaleString('id-ID')}</td></tr></tfoot></table></body></html>`;
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `Rekap_Gaji_SDP.doc`; link.click();
        };

        setInterval(() => { if(sessionUser) render(); }, 30000);
    </script>
</body>
</html>
